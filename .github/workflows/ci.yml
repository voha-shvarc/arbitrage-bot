name: "CI/CD"

on:
  pull_request: {main}
  push: {main}
  workflow_dispatch:

jobs:
  lint:
    name: "Run Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          options: "-l 118 --check --diff --color"

  build_and_push:
    name: "Build and push"
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == "push"
    steps:
      - uses: actions/checkout@v4
      - name: "Login to Docker"
        run: |
          docker login -u ${{ secrets.DOCKER_LOGIN }} -p ${{ secrets.DOCKER_PASSWORD }}
      - name: "Build and push"
        run: |
          docker-compose build --push

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.evnet_name == "push"
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_LOGIN }} -p ${{ secrets.DOCKER_PASSWORD }}
            # need for swarm to read a docker-compose.yml
            export $(cat .env)
            
            docker swarm init
            docker stack deploy --with-auth-registry -c docker-compose.yml app_stack
