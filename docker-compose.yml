version: '3.3'

services:
  bot:
    build: .
    image: ${APP_IMAGE_NAME}
    restart: always
    deploy:
      replicas: 3
    command: ["/app/docker/bot.sh"]
    volumes:
      - .env:/app/.env
    networks:
      - main
    depends_on:
      - db

  db:
    build: ./docker/postgres/.
    image: ${DB_IMAGE_NAME}
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - main

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - main

  celery:
    build: .
    image: ${APP_IMAGE_NAME}
    restart: always
    command: ["/app/docker/celery.sh", "celery"]
    volumes:
      - .env:/app/.env
    networks:
      - main
    depends_on:
      - db

  celery-beat:
    build: .
    image: ${APP_IMAGE_NAME}
    restart: always
    command: ["/app/docker/celery.sh", "beat"]
    volumes:
      - .env:/app/.env
    networks:
      - main
    depends_on:
      - redis
      - celery

  flower:
    build: .
    image: ${APP_IMAGE_NAME}
    environment:
      - FLOWER_UNAUTHENTICATED_API=True
    restart: always
    command: ["/app/docker/celery.sh", "flower"]
    volumes:
      - .env:/app/.env
    ports:
      - "5555:5555"
    networks:
      - main
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  main:
    driver: bridge
